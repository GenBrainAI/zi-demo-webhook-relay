name: CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Helm Lint
        run: helm lint charts/zi-demo-webhook-relay

      - name: Validate Values
        run: |
          echo "Validating Helm values..."
          helm template zi-demo-webhook-relay charts/zi-demo-webhook-relay --values charts/zi-demo-webhook-relay/values.yaml
          echo "✓ Template renders successfully"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-validate, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t webhook-relay:${{ github.sha }} .

      - name: Image built successfully
        run: echo "✓ Docker image built — ready for deployment"
