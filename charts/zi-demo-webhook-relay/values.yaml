replicaCount: 2

image:
  repository: us-central1-docker.pkg.dev/zi-platform/services/webhook-relay
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 5

env:
  - name: LOG_LEVEL
    value: "info"
  - name: FORWARD_TIMEOUT
    value: "30"
